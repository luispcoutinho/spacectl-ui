name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build universal app
        run: ./build.sh

      - name: Verify bundle
        run: |
          codesign --verify --strict spacectl-ui.app
          archs=$(lipo -archs spacectl-ui.app/Contents/MacOS/spacectl-ui)
          echo "architectures: $archs"
          [[ "$archs" == *arm64* && "$archs" == *x86_64* ]]
