name: Release

# Merging a change to VERSION on main publishes a GitHub Release named v<VERSION> (the tag is created
# with it). Nothing happens if that tag already exists. "Run workflow" (manual) is a dry run: it
# builds the zip and attaches it to the run, without a release.
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write       # create the tag and release
  id-token: write       # build provenance attestation
  attestations: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Resolve version
        id: v
        run: |
          tag="v$(cat VERSION)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]] && git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists, nothing to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build package
        if: steps.v.outputs.skip != 'true'
        run: ./build.sh dist

      - name: Checksum
        if: steps.v.outputs.skip != 'true'
        run: |
          cd dist
          shasum -a 256 spacectl-ui-*.zip > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.v.outputs.skip != 'true'
        with:
          name: spacectl-ui
          path: dist/*

      # Provenance proves the zip came from this workflow. Private repos need a paid plan for it.
      - name: Attest build provenance
        if: ${{ steps.v.outputs.skip != 'true' && !github.event.repository.private }}
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/spacectl-ui-*.zip

      - name: Publish release
        if: ${{ steps.v.outputs.skip != 'true' && github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: gh release create "$TAG" dist/spacectl-ui-*.zip dist/SHA256SUMS --target "$GITHUB_SHA" --generate-notes --title "$TAG"
