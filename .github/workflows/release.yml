name: Release

# Push a tag like v0.2.0 to publish a GitHub Release with the zip.
# "Run workflow" (manual) does a dry run: it builds the zip and attaches it to the run, no release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write       # create the release
  id-token: write       # build provenance attestation
  attestations: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Tag must match VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          [[ "${GITHUB_REF_NAME}" == "v$(cat VERSION)" ]] || {
            echo "tag ${GITHUB_REF_NAME} does not match VERSION v$(cat VERSION)"; exit 1; }

      - name: Build package
        run: ./build.sh dist

      - name: Checksum
        run: |
          cd dist
          shasum -a 256 spacectl-ui-*.zip > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: spacectl-ui
          path: dist/*

      # Provenance proves the zip came from this workflow. Private repos need a paid plan for it.
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/spacectl-ui-*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/spacectl-ui-*.zip dist/SHA256SUMS --generate-notes --title "$GITHUB_REF_NAME"
